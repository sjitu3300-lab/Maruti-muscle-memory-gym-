<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Details - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            padding: 40px 5%;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .back-btn {
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:hover {
            border-color: #d9381e;
            color: #d9381e;
        }
        h1 {
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #fff;
            text-align: center;
        }
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 850px;
            margin: 0 auto;
        }
        .exercise-detail-card {
            background: #141414;
            border: 1px solid #222;
            border-left: 4px solid #d9381e;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .ex-img-box {
            width: 160px;
            height: 160px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .ex-info {
            flex: 1;
        }
        .ex-label {
            color: #d9381e;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            display: block;
        }
        .ex-info h4 {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .ex-info h4 span {
            color: #d9381e;
        }
        .ex-info p {
            color: #999;
            font-size: 13px;
            line-height: 1.6;
        }
        .ex-info p strong {
            color: #fff;
        }

        @media(max-width: 768px) {
            .exercise-detail-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .ex-img-box {
                width: 100%;
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="beginner.html" class="back-btn">&larr; Back to Schedule</a>
        <span id="pageBadge" style="font-size: 11px; color: #d9381e; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Detailed Guide</span>
    </div>

    <h1 id="pageTitle">Workout Details</h1>

    <!-- Dynamic Exercise Container -->
    <div class="exercise-list" id="exerciseContainer">
        <!-- Content will be loaded dynamically based on URL parameter -->
    </div>

        titleEl.innerText = currentData.title;
        badgeEl.innerText = currentData.badge;

        // Render HTML dynamically
        let htmlContent = '';
        currentData.exercises.forEach((ex, index) => {
            htmlContent += `
                <div class="exercise-detail-card">
                    <div class="ex-img-box" style="background-image: url('${ex.img}');"></div>
                    <div class="ex-info">
                        <span class="ex-label">${ex.label}</span>
                        <h4><span>EXERCISE 0${index+1}:</span> ${ex.name}</h4>
                        <p>${ex.desc}</p>
                    </div>
                </div>
            `;
        });
        container.innerHTML = htmlContent;

</body>
</html>
