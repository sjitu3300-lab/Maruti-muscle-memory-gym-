<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Details - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            padding: 40px 5%;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .back-btn {
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:hover {
            border-color: #d9381e;
            color: #d9381e;
        }
        h1 {
            font-size: clamp(26px, 4vw, 34px);
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #fff;
            text-align: center;
        }
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 850px;
            margin: 0 auto;
        }
        .exercise-detail-card {
            background: #141414;
            border: 1px solid #222;
            border-left: 4px solid #d9381e;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .ex-img-box {
            width: 150px;
            height: 150px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .ex-info {
            flex: 1;
        }
        .ex-label {
            color: #d9381e;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            display: block;
        }
        .ex-info h4 {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .ex-info p {
            color: #999;
            font-size: 13px;
            line-height: 1.6;
        }
        .ex-info p strong {
            color: #fff;
        }

        @media(max-width: 768px) {
            .exercise-detail-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .ex-img-box {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="beginner.html" class="back-btn">&larr; Back to Schedule</a>
        <span id="pageBadge" style="font-size: 11px; color: #d9381e; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Detailed Guide</span>
    </div>

    <h1 id="pageTitle">Workout Details</h1>

    <!-- Dynamic Exercise Container -->
    <div class="exercise-list" id="exerciseContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const day = urlParams.get('day') || '1';

        const container = document.getElementById('exerciseContainer');
        const titleEl = document.getElementById('pageTitle');
        const badgeEl = document.getElementById('pageBadge');

        const workoutData = {
            '1': {
                title: "Day 1: Cardio, Cycling, Abs & Complete Chest Workout",
                badge: "Day 01 Detailed Guide",
                exercises: [
                    { label: "Warm-up 01", name: "Jumping Jacks", sets: "3 Sets x 1 Min", img: "https://cdn.shopify.com/s/files/1/1876/4703/articles/shutterstock_1608606593_1600x.jpg?v=1644852561", desc: "Seedhe khade ho kar haath aur pair kholte hue jump karein. Yeh exercise aapke heart rate ko tezi se badhati hai aur poore sharir mein blood circulation behtar karti hai." },
                    { label: "Cardio 02", name: "Stationary Cycling", sets: "5 - 10 Mins", img: "https://images.healthshots.com/healthshots/en/uploads/2020/11/10175412/stationary-bike-1600x900.jpg", desc: "Cycle par comfortable baith kar lagataar pedaling karein. Isse lower body ki endurance sudhartee hai aur extra calories burn hoti hain bina joints par load dale." },
                    { label: "Core 03", name: "Basic Crunches (Abs)", sets: "3 Sets x 15 Reps", img: "https://post.healthline.com/wp-content/uploads/2020/06/crunch-1200x628-facebook-1200x628.jpg", desc: "Zameen par peeth ke bal let kar ghutne moodein aur upper body ko aage ki taraf squeeze karein. Yeh abs aur core muscles ko strong banati hai." },
                    { label: "Chest 04", name: "Bench Press", sets: "3 Sets x 15 Reps", img: "https://cdn.shopify.com/s/files/1/1876/4703/files/dumbbell_bench_press_480x480.jpg?v=1666044002", desc: "Flat bench par let kar barbell ya dumbbells ko chest ke upar upar aur neeche control ke sath push karein. Yeh chest building ki main exercise hai." },
                    { label: "Chest 05", name: "Incline Bench Press", sets: "3 Sets x 15 Reps", img: "https://i0.wp.com/www.strengthlog.com/wp-content/uploads/2020/12/Incline-Dumbbell-Press-scaled.jpg?fit=2560%2C1707&ssl=1", desc: "Bench ko 30-45 degree angle par set karein aur weight ko upper chest ki taraf press karein. Isse upper chest ka hissa achhi tarah develop hota hai." },
                    { label: "Chest 06", name: "Dumbbell Press", sets: "3 Sets x 15 Reps", img: "https://www.muscleandfitness.com/wp-content/uploads/2019/06/Muscular-Man-Dumbbell-Bench-Press-Chest.jpg?quality=86&strip=all", desc: "Flat bench par dono haatho mein dumbbells pakad kar upar ki taraf press karein. Isse muscles ko deeper stretch aur behtar balance milta hai." },
                    { label: "Chest 07", name: "Incline Dumbbell Press", sets: "3 Sets x 15 Reps", img: "https://hips.hearstapps.com/hmg-prod/images/mh-trainer-4-1643906913.png?crop=0.502xw_1.00xh;0.248xw,0&resize=1200:*", desc: "Incline bench par dumbbells ke sath perform karein. Yeh dono haatho ki strength equal rakhti hai aur muscle symmetry banati hai." },
                    { label: "Chest 08", name: "Close Grip Dumbbell Press on Flat Bench", sets: "3 Sets x 15 Reps", img: "https://fitnessvolt.com/wp-content/uploads/2021/03/close-grip-dumbbell-press.jpg", desc: "Dumbbells ko aapas mein touch karte hue pakrein aur chest ke beech ke hisse par zor dete hue press karein. Yeh inner chest aur triceps target karti hai." },
                    { label: "Chest 09", name: "Pec Fly / Butterfly", sets: "3 Sets x 15 Reps", img: "https://i.ytimg.com/vi/4t5ZgT13U0Q/maxresdefault.jpg", desc: "Machine ya dumbbells par haatho ko gol ghumate hue aage laayein aur chest ki muscles ko squeeze karein. Yeh chest finishing ke liye best hai." }
                ]
            },
            '2': {
                title: "Day 2: Jumping Jacks, Cycling, Abs, Back & Squats",
                badge: "Day 02 Detailed Guide",
                exercises: [
                    { label: "Exercise 01", name: "Jumping Jacks", sets: "3 Sets x 1 Min", img: "https://cdn.shopify.com/s/files/1/1876/4703/articles/shutterstock_1608606593_1600x.jpg?v=1644852561", desc: "Poore sharir ko active karne aur body temperature badhane ke liye jumping jacks karein[span_0](start_span)[span_0](end_span)." },
                    { label: "Exercise 02", name: "Stationary Cycling", sets: "5 - 10 Mins", img: "https://images.healthshots.com/healthshots/en/uploads/2020/11/10175412/stationary-bike-1600x900.jpg", desc: "Lower body ki stamina aur leg endurance badhane ke liye stationary bike par cycling karein[span_1](start_span)[span_1](end_span)." },
                    { label: "Exercise 03", name: "Abs Workout (Crunches)", sets: "3 Sets x 15 Reps", img: "https://post.healthline.com/wp-content/uploads/2020/06/crunch-1200x628-facebook-1200x628.jpg", desc: "Core ko tone karne aur pet ki charbi kam karne ke liye crunches perform karein[span_2](start_span)[span_2](end_span)." },
                    { label: "Exercise 04", name: "Back Workout", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1603287681836-b174ce5074c2?auto=format&fit=crop&q=80&w=800", desc: "Peeth ki muscles ko mazboot banane aur posture sudharne ke liye back exercise karein[span_3](start_span)[span_3](end_span)." },
                    { label: "Exercise 05", name: "Normal Squats & Calves", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&q=80&w=800", desc: "Khadde ho kar peeche chair ki tarah baithte hue uthein (Squats), aur panjon par khade ho kar calves train karein[span_4](start_span)[span_4](end_span)." }
                ]
            },
            '3': {
                title: "Day 3: Cycling, Jumping Jacks, Abs & Shoulder",
                badge: "Day 03 Detailed Guide",
                exercises: [
                    { label: "Exercise 01", name: "Stationary Cycling", sets: "5 - 10 Mins", img: "https://images.healthshots.com/healthshots/en/uploads/2020/11/10175412/stationary-bike-1600x900.jpg", desc: "Legs ki muscles ko warm-up karne ke liye cycling se workout ki shuruat karein[span_5](start_span)[span_5](end_span)." },
                    { label: "Exercise 02", name: "Jumping Jacks", sets: "3 Sets x 1 Min", img: "https://cdn.shopify.com/s/files/1/1876/4703/articles/shutterstock_1608606593_1600x.jpg?v=1644852561", desc: "Fat loss process ko fast karne aur body mein energy lane ke liye jumping jacks karein[span_6](start_span)[span_6](end_span)." },
                    { label: "Exercise 03", name: "Abs Workout", sets: "3 Sets x 15 Reps", img: "https://post.healthline.com/wp-content/uploads/2020/06/crunch-1200x628-facebook-1200x628.jpg", desc: "Pet ke core area ko strong aur tight banane ke liye abs routine follow karein[span_7](start_span)[span_7](end_span)." },
                    { label: "Exercise 04", name: "Shoulder Workout", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1532029837206-abbe2b7675e3?auto=format&fit=crop&q=80&w=800", desc: "Dumbbells ko kandho ke upar uthate hue shoulders ki breadth aur shape ko develop karein[span_8](start_span)[span_8](end_span)." }
                ]
            },
            '4': {
                title: "Day 4: Cycling, Jumping Jacks, Abs, Biceps, Triceps, Forearm & Squats",
                badge: "Day 04 Detailed Guide",
                exercises: [
                    { label: "Exercise 01", name: "Stationary Cycling", sets: "5 - 10 Mins", img: "https://images.healthshots.com/healthshots/en/uploads/2020/11/10175412/stationary-bike-1600x900.jpg", desc: "Poori body mein blood flow badhane ke liye cycling karein[span_9](start_span)[span_9](end_span)." },
                    { label: "Exercise 02", name: "Jumping Jacks", sets: "3 Sets x 1 Min", img: "https://cdn.shopify.com/s/files/1/1876/4703/articles/shutterstock_1608606593_1600x.jpg?v=1644852561", desc: "Metabolism ko high level par le jane ke liye jumping jacks karein[span_10](start_span)[span_10](end_span)." },
                    { label: "Exercise 03", name: "Abs Workout", sets: "3 Sets x 15 Reps", img: "https://post.healthline.com/wp-content/uploads/2020/06/crunch-1200x628-facebook-1200x628.jpg", desc: "Core stability aur flat stomach ke liye abs exercise perform karein[span_11](start_span)[span_11](end_span)." },
                    { label: "Exercise 04", name: "Biceps Curl", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&q=80&w=800", desc: "Haatho mein weight pakad kar upar ki taraf bend karein taaki biceps muscle build ho[span_12](start_span)[span_12](end_span)." },
                    { label: "Exercise 05", name: "Triceps Extension", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1532029837206-abbe2b7675e3?auto=format&fit=crop&q=80&w=800", desc: "Arms ke pichle hisse (triceps) ko mazboot aur toned banane ke liye yeh exercise karein[span_13](start_span)[span_13](end_span)." },
                    { label: "Exercise 06", name: "Forearm Workout", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&q=80&w=800", desc: "Grip strength badhane ke liye forearm ki exercises perform karein[span_14](start_span)[span_14](end_span)." },
                    { label: "Exercise 07", name: "Normal Squats & Calves", sets: "3 Sets x 15 Reps", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&q=80&w=800", desc: "Lower body ko poori strength dete hue normal squats aur calves ke sath hafte ka workout khtm karein[span_15](start_span)[span_15](end_span)." }
                ]
            }
        };

        const currentData = workoutData[day] || workoutData['1'];
        titleEl.innerText = currentData.title;
        badgeEl.innerText = currentData.badge;

        let htmlContent = '';
        currentData.exercises.forEach((ex) => {
            htmlContent += `
                <div class="exercise-detail-card">
                    <div class="ex-img-box" style="background-image: url('${ex.img}');"></div>
                    <div class="ex-info">
                        <span class="ex-label">${ex.label}</span>
                        <h4>${ex.name} (${ex.sets})</h4>
                        <p>${ex.desc}</p>
                    </div>
                </div>
            `;
        });
        container.innerHTML = htmlContent;
    </script>
</body>
</html>
