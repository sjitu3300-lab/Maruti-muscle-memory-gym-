<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-container {
            background: #141414;
            border: 1px solid #222;
            border-top: 4px solid #d9381e;
            padding: 35px 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(217, 56, 30, 0.2);
        }
        .brand-logo {
            font-size: 12px;
            font-weight: 900;
            color: #d9381e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .brand-logo span {
            color: #fff;
        }
        /* Auto Initials Avatar */
        .avatar-circle {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #d9381e 0%, #700c00 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            margin: 0 auto 15px auto;
            box-shadow: 0 5px 20px rgba(217, 56, 30, 0.5);
            letter-spacing: 2px;
        }
        .user-name {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #fff;
        }
        
        /* Snapchat Style Consistency Fire Streak Box */
        .streak-box {
            background: linear-gradient(135deg, #2a120a 0%, #161616 100%);
            border: 1px solid #d9381e;
            padding: 12px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .streak-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 900;
            color: #ff5722;
        }
        .streak-right {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: right;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .info-box {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .info-box span {
            display: block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .info-box strong {
            font-size: 13px;
            color: #fff;
            text-transform: uppercase;
        }

        /* Task Completion Progress Section */
        .task-progress-box {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            text-align: left;
        }
        .task-progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #bbb;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #d9381e;
            width: 0%;
            transition: width 0.5s ease;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-main {
            width: 100%;
            background-color: #d9381e;
            color: white;
            padding: 12px;
            border: none;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }
        .btn-main:hover { background-color: #b52d16; }
        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        .btn-secondary:hover { border-color: #fff; color: #fff; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="brand-logo">Maruti <span>Muscle Memory</span></div>
        
        <!-- Auto Initials Logo -->
        <div class="avatar-circle" id="userInitials">JS</div>
        <h2 class="user-name" id="displayName">Jitendra Soni</h2>

        <!-- Snapchat Style Consistency Fire Streak -->
        <div class="streak-box">
            <div class="streak-left">
                🔥 <span id="streakCount">5</span> Days
            </div>
            <div class="streak-right">
                Consistency<br><span style="font-size:9px; color:#d9381e;">Streak Active</span>
            </div>
        </div>

        <!-- User Information Grid -->
        <div class="info-grid">
            <div class="info-box">
                <span>Mobile ID</span>
                <strong id="displayMobile">8947012333</strong>
            </div>
            <div class="info-box">
                <span>Age</span>
                <strong id="displayAge">25 Years</strong>
            </div>
            <div class="info-box" style="grid-column: span 2;">
                <span>Training Level</span>
                <strong id="displayLevel" style="color: #d9381e;">Absolute Beginner</strong>
            </div>
        </div>

        <!-- Task Completion Tracker -->
        <div class="task-progress-box">
            <div class="task-progress-header">
                <span>Today's Tasks Done</span>
                <span id="taskStatusText">4 / 6 Completed</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="action-btns">
            <a href="dashboard.html" class="btn-main">Open Today's Workout Task &rarr;</a>
            <a href="index_2.html" class="btn-main btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        // Fetch user data from localStorage
        const user = JSON.parse(localStorage.getItem('gymUser')) || {
            name: "Jitendra Soni",
            mobile: "8947012333",
            age: "25",
            level: "beginner",
            initials: "JS",
            streak: 5,
            tasksCompleted: 4,
            totalTasks: 6
        };

        // Populate HTML elements
        document.getElementById('userInitials').innerText = user.initials || "JS";
        document.getElementById('displayName').innerText = user.name;
        document.getElementById('displayMobile').innerText = user.mobile;
        document.getElementById('displayAge').innerText = user.age + " Years";
        document.getElementById('displayLevel').innerText = user.level.toUpperCase();
        document.getElementById('streakCount').innerText = user.streak || 5;

        // Task Progress Calculation
        const completed = user.tasksCompleted || 4;
        const total = user.totalTasks || 6;
        const percentage = (completed / total) * 100;

        document.getElementById('taskStatusText').innerText = `${completed} / ${total} Completed`;
        document.getElementById('progressBar').style.width = `${percentage}%`;
    </script>

</body>
</html>
