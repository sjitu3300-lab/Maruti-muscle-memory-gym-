<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-container {
            background: #141414;
            border: 1px solid #222;
            border-top: 4px solid #d9381e;
            padding: 35px 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(217, 56, 30, 0.2);
        }
        .brand-logo {
            font-size: 12px;
            font-weight: 900;
            color: #d9381e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .brand-logo span {
            color: #fff;
        }

        /* Avatar & Change Logo Section */
        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 10px auto;
        }
        .avatar-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #d9381e 0%, #700c00 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 5px 20px rgba(217, 56, 30, 0.5);
            letter-spacing: 2px;
            background-size: cover;
            background-position: center;
        }
        .change-logo-label {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            font-weight: 800;
            color: #d9381e;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: underline;
        }
        .change-logo-label:hover {
            color: #fff;
        }
        #fileInput {
            display: none;
        }

        .user-name {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #fff;
            margin-top: 10px;
        }
        
        /* Consistency Fire Streak Box */
        .streak-box {
            background: linear-gradient(135deg, #2a120a 0%, #161616 100%);
            border: 1px solid #d9381e;
            padding: 12px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .streak-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 900;
            color: #ff5722;
        }
        .streak-right {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: right;
        }
        .scan-qr-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }
        .scan-qr-btn:hover {
            background: #d9381e;
            border-color: #d9381e;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .info-box {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            padding: 10px 14px;
            border-radius: 6px;
        }
        .info-box span {
            display: block;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }
        .info-box strong {
            font-size: 13px;
            color: #fff;
            text-transform: uppercase;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-main {
            width: 100%;
            background-color: #d9381e;
            color: white;
            padding: 12px;
            border: none;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }
        .btn-main:hover { background-color: #b52d16; }
        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        .btn-secondary:hover { border-color: #fff; color: #fff; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="brand-logo">Maruti <span>Muscle Memory</span></div>
        
        <!-- Logo & Change Logo Section -->
        <div class="avatar-container">
            <div class="avatar-circle" id="userAvatar">JS</div>
        </div>
        <label for="fileInput" class="change-logo-label">Change Logo (Upload Image)</label>
        <input type="file" id="fileInput" accept="image/*" onchange="loadNewLogo(event)">

        <h2 class="user-name" id="displayName">Jitendra Soni</h2>

        <!-- Consistency Fire Streak Section (24 Hour QR Check) -->
        <div class="streak-box">
            <div class="streak-left">
                🔥 <span id="streakCount">1</span> Day
            </div>
            <div class="streak-right">
                Consistency Active<br>
                <button class="scan-qr-btn" onclick="simulateQRScan()">Simulate QR Scan</button>
            </div>
        </div>

        <!-- User Detailed Info Grid -->
        <div class="info-grid">
            <div class="info-box">
                <span>First Name</span>
                <strong id="displayFirstName">Jitendra</strong>
            </div>
            <div class="info-box">
                <span>Last Name</span>
                <strong id="displayLastName">Soni</strong>
            </div>
            <div class="info-box">
                <span>Mobile ID</span>
                <strong id="displayMobile">8947012333</strong>
            </div>
            <div class="info-box">
                <span>Age</span>
                <strong id="displayAge">25 Years</strong>
            </div>
            <div class="info-box" style="grid-column: span 2;">
                <span>Training Level</span>
                <strong id="displayLevel" style="color: #d9381e;">Absolute Beginner</strong>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-btns">
            <a href="dashboard.html" class="btn-main">Today Workout Task &rarr;</a>
            <a href="index_2.html" class="btn-main btn-secondary">Home Page</a>
        </div>
    </div>

    <script>
        // LocalStorage se data load karein
        let user = JSON.parse(localStorage.getItem('gymUser')) || {
            name: "Jitendra Soni",
            mobile: "8947012333",
            age: "25",
            level: "beginner",
            initials: "JS",
            streak: 1,
            lastScanDate: null,
            customAvatar: null
        };

        // Name split parts for First, Middle, Last
        const nameParts = user.name.split(' ');
        const firstName = nameParts[0] || "";
        const lastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : "";

        // DOM Elements update karein
        document.getElementById('displayName').innerText = user.name;
        document.getElementById('displayFirstName').innerText = firstName;
        document.getElementById('displayLastName').innerText = lastName || "N/A";
        document.getElementById('displayMobile').innerText = user.mobile;
        document.getElementById('displayAge').innerText = user.age + " Years";
        document.getElementById('displayLevel').innerText = user.level.toUpperCase();
        document.getElementById('streakCount').innerText = user.streak;

        const avatarEl = document.getElementById('userAvatar');
        if (user.customAvatar) {
            avatarEl.innerText = "";
            avatarEl.style.backgroundImage = `url('${user.customAvatar}')`;
        } else {
            avatarEl.innerText = user.initials || "JS";
        }

        // Change Logo / Gallery Image Load Function
        function loadNewLogo(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const imageUrl = reader.result;
                avatarEl.innerText = "";
                avatarEl.style.backgroundImage = `url('${imageUrl}')`;
                user.customAvatar = imageUrl;
                localStorage.setItem('gymUser', JSON.stringify(user));
                alert('Logo image successfully updated and saved!');
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // QR Scan Consistency Logic (24 Hours / Date Change Check)
        function simulateQRScan() {
            const now = new Date().getTime();
            const lastScan = user.lastScanDate || 0;
            const twentyFourHours = 24 * 60 * 60 * 1000;

            // Testing ke liye condition: Agar 24 ghante beet chuke hain ya naya din hai
            if (now - lastScan >= twentyFourHours || isNewDay(lastScan, now)) {
                user.streak += 1;
                user.lastScanDate = now;
                localStorage.setItem('gymUser', JSON.stringify(user));
                document.getElementById('streakCount').innerText = user.streak;
                alert(`QR Scanned Successfully! Your consistency streak is now ${user.streak} Days 🔥`);
            } else {
                alert('Aapne pichle 24 ghante mein pehle hi QR scan kar liya hai. Agla scan kal (24 hours ke baad) hoga!');
            }
        }

        function isNewDay(lastTime, currentTime) {
            if(!lastTime) return true;
            const d1 = new Date(lastTime).toDateString();
            const d2 = new Date(currentTime).toDateString();
            return d1 !== d2;
        }
    </script>

</body>
</html>
