<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .profile-wrapper {
            width: 100%;
            max-width: 550px;
            background: #141414;
            border: 1px solid #262626;
            border-top: 4px solid #d9381e;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
        }
        /* Top Navigation (Back & Settings) */
        .profile-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .nav-btn {
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-btn:hover {
            border-color: #d9381e;
            color: #d9381e;
        }
        .settings-icon {
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .settings-icon:hover {
            color: #d9381e;
            transform: rotate(45deg);
        }

        /* Circular Profile Image Section */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #1c1c1c;
            border: 3px solid #d9381e;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(217, 56, 30, 0.3);
        }
        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-circle span {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
        }
        .upload-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            font-size: 9px;
            text-transform: uppercase;
            text-align: center;
            padding: 4px 0;
            color: #fff;
            letter-spacing: 1px;
        }
        #fileInput {
            display: none;
        }
        .user-main-name {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 12px;
            letter-spacing: 1px;
            color: #fff;
        }
        .user-role-badge {
            font-size: 10px;
            background: rgba(217, 56, 30, 0.2);
            color: #d9381e;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 800;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Profile Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .detail-box {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            padding: 14px 16px;
            border-radius: 6px;
        }
        .detail-box.full-width {
            grid-column: span 2;
        }
        .detail-label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 4px;
            display: block;
        }
        .detail-value {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        /* Edit/Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-box {
            background: #141414;
            border: 1px solid #333;
            border-top: 4px solid #d9381e;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }
        .modal-box h3 {
            font-size: 16px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: #fff;
        }
        .modal-box input {
            width: 100%;
            padding: 10px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .save-btn {
            background: #d9381e;
            color: #fff;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="profile-wrapper">
        <!-- Top Bar -->
        <div class="profile-top-bar">
            <a href="index.html" class="nav-btn">&larr; Back to Home</a>
            <div class="settings-icon" onclick="openSettingsModal()" title="Settings">⚙️</div>
        </div>

        <!-- Avatar & Basic Header -->
        <div class="avatar-container">
            <div class="profile-circle" onclick="document.getElementById('fileInput').click()" title="Click to change photo">
                <span id="avatarInitials">MS</span>
                <img id="profileImgElement" src="" alt="" style="display: none;">
                <div class="upload-overlay">Edit Photo</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
            <div class="user-main-name" id="dispFullName">Loading...</div>
            <div class="user-role-badge" id="dispCategory">Member</div>
        </div>

        <!-- Detailed Fields Grid -->
        <div class="details-grid">
            <div class="detail-box">
                <span class="detail-label">First Name</span>
                <span class="detail-value" id="dispFirstName">-</span>
            </div>
            <div class="detail-box">
                <span class="detail-label">Middle Name</span>
                <span class="detail-value" id="dispMiddleName">-</span>
            </div>
            <div class="detail-box">
                <span class="detail-label">Last Name</span>
                <span class="detail-value" id="dispLastName">-</span>
            </div>
            <div class="detail-box">
                <span class="detail-label">Date of Birth (DOB)</span>
                <span class="detail-value" id="dispDob">-</span>
            </div>
            <div class="detail-box full-width">
                <span class="detail-label">Mobile Number (Login ID)</span>
                <span class="detail-value" id="dispMobile">-</span>
            </div>
            <div class="detail-box">
                <span class="detail-label">Selected Category / Plan</span>
                <span class="detail-value" id="dispPlan">-</span>
            </div>
            <div class="detail-box">
                <span class="detail-label">Monthly Price</span>
                <span class="detail-value" id="dispPrice">-</span>
            </div>
            <div class="detail-box full-width">
                <span class="detail-label">Assigned Trainer</span>
                <span class="detail-value" id="dispTrainer">-</span>
            </div>
        </div>
    </div>

    <!-- Settings Modal for Quick Update -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <h3>Update Profile Details</h3>
            <label style="font-size: 10px; color: #888; text-transform: uppercase;">Update Mobile Number</label>
            <input type="tel" id="editMobile" placeholder="New mobile number">
            <button class="save-btn" onclick="saveSettings()">Save Changes</button>
            <button onclick="closeSettingsModal()" style="background:none; border:none; color:#777; width:100%; margin-top:10px; cursor:pointer; font-size:11px; text-transform:uppercase;">Cancel</button>
        </div>
    </div>

    <script>
        // Load User Data on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('gymUser');
            if (savedUser) {
                const user = JSON.parse(savedUser);

                document.getElementById('dispFullName').innerText = user.name || "Member";
                document.getElementById('dispFirstName').innerText = user.firstName || "-";
                document.getElementById('dispMiddleName').innerText = user.middleName || "N/A";
                document.getElementById('dispLastName').innerText = user.lastName || "-";
                document.getElementById('dispDob').innerText = user.dob || "-";
                document.getElementById('dispMobile').innerText = user.mobile || "-";
                document.getElementById('dispCategory').innerText = user.category || "General Member";
                document.getElementById('dispPlan').innerText = user.category || "-";
                document.getElementById('dispPrice').innerText = user.price || "-";
                document.getElementById('dispTrainer').innerText = user.trainer || "Jitendra Soni (Head Coach)";

                // Initials or Image
                if (user.profileImage) {
                    const imgEl = document.getElementById('profileImgElement');
                    imgEl.src = user.profileImage;
                    imgEl.style.display = 'block';
                    document.getElementById('avatarInitials').style.display = 'none';
                } else if (user.initials) {
                    document.getElementById('avatarInitials').innerText = user.initials;
                }
            } else {
                alert('Pehle account register karein!');
                window.location.href = 'register.html';
            }
        });

        // Gallery Image Upload Handler (Base64 conversion for localStorage)
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    
                    // Display image
                    const imgEl = document.getElementById('profileImgElement');
                    imgEl.src = base64Image;
                    imgEl.style.display = 'block';
                    document.getElementById('avatarInitials').style.display = 'none';

                    // Update localStorage
                    let user = JSON.parse(localStorage.getItem('gymUser')) || {};
                    user.profileImage = base64Image;
                    localStorage.setItem('gymUser', JSON.stringify(user));
                };
                reader.readAsDataURL(file);
            }
        }

        // Settings Modal Controls
        function openSettingsModal() {
            const user = JSON.parse(localStorage.getItem('gymUser'));
            if(user) {
                document.getElementById('editMobile').value = user.mobile || '';
            }
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            const newMobile = document.getElementById('editMobile').value.trim();
            let user = JSON.parse(localStorage.getItem('gymUser')) || {};
            user.mobile = newMobile;
            localStorage.setItem('gymUser', JSON.stringify(user));

            document.getElementById('dispMobile').innerText = newMobile;
            closeSettingsModal();
            alert('Profile updated successfully!');
        }
    </script>
</body>
</html>
