<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration - Maruti Muscle Memory GYM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .reg-container {
            background: #141414;
            border: 1px solid #262626;
            border-top: 4px solid #d9381e;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .reg-title {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: #fff;
            text-align: center;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #d9381e;
            outline: none;
        }
        .submit-reg-btn {
            width: 100%;
            background-color: #d9381e;
            color: white;
            padding: 14px;
            border: none;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-reg-btn:hover {
            background-color: #b52d16;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .back-home:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="reg-container">
        <div class="reg-title">New Member Registration</div>
        <form id="standaloneRegForm" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="Apna pura naam likhein">
            </div>
            <div class="form-group">
                <label>Mobile Number (Login ID)</label>
                <input type="tel" id="mobileNumber" required placeholder="10-digit mobile number">
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" required placeholder="Aapki umar">
            </div>
            <div class="form-group">
                <label>Select Fitness Level</label>
                <select id="fitnessLevel" required>
                    <option value="" disabled selected>Level chuniye</option>
                    <option value="Absolute Beginner">Absolute Beginner (Zero Experience)</option>
                    <option value="Restart / Intermediate">Restart / Intermediate</option>
                    <option value="Advanced (1-2 Years)">Advanced (1-2 Years)</option>
                </select>
            </div>
            <button type="submit" class="submit-reg-btn">Create Profile & View Task &rarr;</button>
        </form>
        <a href="index.html" class="back-home">&larr; Back to Home</a>
    </div>

    <script>
        function handleRegistration(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const age = document.getElementById('age').value.trim();
            const fitnessLevel = document.getElementById('fitnessLevel').value;

            // Generate user initials for profile icon (e.g., "Rahul Sharma" -> "RS")
            const nameParts = fullName.split(' ');
            let initials = nameParts[0][0];
            if (nameParts.length > 1) {
                initials += nameParts[nameParts.length - 1][0];
            }
            initials = initials.toUpperCase();

            // Create user profile object
            const userData = {
                name: fullName,
                mobile: mobileNumber,
                age: age,
                level: fitnessLevel,
                initials: initials,
                registeredDate: new Date().toLocaleDateString()
            };

            // Save data to localStorage
            localStorage.setItem('gymUser', JSON.stringify(userData));

            // Redirect instantly to profile page
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
